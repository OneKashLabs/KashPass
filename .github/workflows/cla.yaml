name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "CLA Assistant"
        # contains() lets the job start when the sign phrase or `recheck` comes with
        # extra text; the action enforces the exact match.
        if: github.event_name == 'pull_request_target' || contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
        # Maintained fork of the archived contributor-assistant/github-action: Node 24,
        # a guard that the PR opener authored or co-authored a commit, Co-authored-by
        # trailer support and email allowlist matching. Pinned by commit SHA.
        uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          # noreply@anthropic.com is the Co-authored-by address AI assistants add;
          # allowlisting it skips that synthetic co-author, and the PR opener still signs.
          allowlist: "one-kash,dependabot[bot],github-actions[bot],noreply@anthropic.com"
