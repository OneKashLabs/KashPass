# Project-wide Gradle settings.
# deterministicdebugging makes R8 run on one thread. On several threads R8 9.5 picks one parameter
# type in a Compose method differently from run to run, so two builds of one commit give different
# dex files and the reproducible-build check that F-Droid runs fails.
org.gradle.jvmargs=-Xmx4096m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.deterministicdebugging=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true
